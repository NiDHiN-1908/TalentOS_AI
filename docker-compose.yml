version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: talentos-postgres
    environment:
      POSTGRES_DB: talentos_db
      POSTGRES_USER: talentos_user
      POSTGRES_PASSWORD: talentos_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/V1__initial_enterprise_schema.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talentos_user -d talentos_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: talentos-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend-python
      dockerfile: Dockerfile
    container_name: talentos-backend
    environment:
      PROJECT_NAME: "TalentOS AI Production Engine"
      API_V1_STR: "/api/v1"
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: talentos-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
