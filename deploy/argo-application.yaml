apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: talentos-ai-production
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: 'https://github.com/NiDHiN-1908/TalentOS_AI.git'
    targetRevision: HEAD
    path: helm/talentos-ai
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: talentos-production
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
