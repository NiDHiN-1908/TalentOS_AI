name: TalentOS AI Enterprise CI/CD Pipeline

on:
  push:
    branches: [ main, release/* ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-lint:
    name: 🧪 Run Linter & Test Suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore & Build ASP.NET Core (.NET 9) Microservices
        run: |
          cd backend-dotnet
          dotnet restore TalentOS.sln
          dotnet build TalentOS.sln --configuration Release

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          cd backend-python
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run Backend Pytest Suite
        run: |
          cd backend-python
          pytest -v tests/

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node Dependencies & Test Frontend
        run: |
          npm ci
          npm test

  security-scan:
    name: 🛡️ DevSecOps Security Scan (Trivy)
    runs-on: ubuntu-latest
    needs: test-and-lint
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

  docker-build-and-push:
    name: 🐳 Build & Push Container Image
    runs-on: ubuntu-latest
    needs: security-scan
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push ASP.NET Core Gateway Container Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend-dotnet
          push: true
          tags: ghcr.io/nidhin-1908/talentos-ai-dotnet-gateway:latest

      - name: Build & Push FastAPI Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend-python
          push: true
          tags: ghcr.io/nidhin-1908/talentos-ai-backend:latest
