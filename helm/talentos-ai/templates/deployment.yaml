apiVersion: apps/v1
kind: Deployment
metadata:
  name: talentos-ai-backend
  namespace: talentos-production
  labels:
    app.kubernetes.io/name: talentos-ai-backend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: talentos-ai-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: talentos-ai-backend
    spec:
      containers:
        - name: backend
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8000
              name: http
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            - name: ENVIRONMENT
              value: "{{ .Values.env.ENVIRONMENT }}"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: talentos-vault-secrets
                  key: DATABASE_URL
