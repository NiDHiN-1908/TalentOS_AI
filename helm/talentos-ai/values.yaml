replicaCount: 3

image:
  repository: ghcr.io/nidhin-1908/talentos-ai-backend
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: true
  className: "nginx"
  annotations:
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: api.talentos.ai
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: 2000m
    memory: 4Gi
  requests:
    cpu: 500m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 75
  targetMemoryUtilizationPercentage: 80

env:
  PROJECT_NAME: "TalentOS AI Core"
  ENVIRONMENT: "production"
  DATABASE_URL: "postgresql://postgres:vault_secret@postgres-service:5432/talentos_db"
  REDIS_URL: "redis://redis-service:6379/0"
